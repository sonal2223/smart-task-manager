<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Task Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <header class="header">
            <div>
                <h1>Smart Task Manager</h1>
                <p>Organize your day, one task at a time.</p>
            </div>

            <button id="themeToggle" class="theme-button"
                    aria-label="Toggle dark mode">
                🌙 Dark Mode
            </button>
        </header>

        <section class="stats">
            <div class="stat-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>
        </section>

        <section class="task-form">
            <h2 id="formTitle">Add New Task</h2>

            <form id="taskForm">
                <label for="taskTitle">Task Title</label>

                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Enter your task..."
                    maxlength="120"
                    required
                >

                <label for="taskCategory">Category</label>

                <select id="taskCategory">
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                    <option value="Other">Other</option>
                </select>

                <div class="form-buttons">
                    <button type="submit" id="submitButton">
                        Add Task
                    </button>

                    <button
                        type="button"
                        id="cancelEdit"
                        class="secondary-button"
                        hidden
                    >
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <section class="task-section">
            <h2>My Tasks</h2>

            <div class="controls">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search tasks..."
                    aria-label="Search tasks"
                >

                <select id="filterSelect" aria-label="Filter tasks">
                    <option value="all">All Tasks</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <p id="taskMessage" class="message" role="status"></p>

            <div id="taskList" class="task-list"></div>
        </section>

        <footer>
            <p>Built with HTML, CSS and Modern JavaScript 🚀</p>
        </footer>

    </div>

    <script type="module" src="js/app.js"></script>

</body>
</html>
